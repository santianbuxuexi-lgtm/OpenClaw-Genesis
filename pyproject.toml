[project]
name = "openclaw-genesis"
version = "0.1.0"
description = "Research-layer lineage registry, experiment runner, and benchmark gate for OpenClaw-Genesis."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4.0",
  "mypy>=1.8.0",
]

[project.scripts]
openclaw-genesis = "research_layer.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research_layer*"]
